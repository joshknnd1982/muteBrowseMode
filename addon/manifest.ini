name = muteBrowseMode
summary = "Mute Browse Mode"
description = """NVDA reads out the name of a web page or an email every time one opens, then the word "document", then the first line. This add-on tells it to be quiet, so you can get straight on with reading.

The settings are in the NVDA menu, under Preferences, Settings, Browse Mode. The first one chooses what happens when a page opens: stay silent, play three quick beeps, or leave NVDA alone. The second can tell you how big a web page is instead: "Loading complete. Page has 8 regions, 57 headings and 196 links." Outlook never gets a summary, because Outlook is where this add-on is meant to be quiet.

Swapping between windows is never cut off. NVDA always finishes telling you where you have landed before the quiet starts again.

In Outlook it tidies up the noisy bits. The list of emails no longer says "Subject" in front of every subject. Tabbing into the box you write an email in says only "You are now in the message body, type a message." The F7 spelling checker says "misspelled", then the word it has stopped on, said and then spelled out a fifth slower than usual before your speed goes back to normal, and it no longer treats a full stop as a spelling mistake. At the end it says "Spell check is complete. OK button" once, whether it found mistakes or found none at all.

Fetching new mail reads the progress bar out in full, right through to a hundred percent. A progress bar is the opposite of the noise this add-on removes: something is happening that you cannot see and are waiting on.

A check box puts every link and button in an Outlook email on a line of its own, so the down arrow reaches them one at a time.

Two more check boxes put NVDA's own find box on control+F. It is nicer for reading with than a browser's find bar: it starts from your cursor and leaves your cursor on what it found. One check box covers web browsers, the other covers everywhere except Outlook, where control+F forwards an email and always will. NVDA+control+F opens the find box either way."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
