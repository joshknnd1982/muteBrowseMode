name = muteBrowseMode
summary = "Mute Browse Mode"
description = """Adds two combo boxes and two check boxes to NVDA's Browse Mode settings.

The first stops NVDA from announcing the document and reading the first line every time a web page finishes loading or an Outlook message is opened. In Outlook and in Chromium based browsers it also stops NVDA reading window, dialog and document titles, and silences toasts and live region "flash" messages. The second replaces that silence, in a web browser and only when Outlook is not the program you are in, with "Loading complete" and how many regions, headings and links the page has. Each combo box can also play three quick ascending tones instead, or leave NVDA's normal behaviour alone.

Nothing is ever silenced while NVDA is announcing a window you have just switched to: the title and the control the focus landed on are always read in full first, however fast you cycle through windows. Switching to Microsoft Outlook from somewhere else answers with a brief description of the field the focus is in and what is in it, and tabbing into the body of a message says so.

A check box puts every link, button and other control in an Outlook message on a line of its own, the way NVDA's own screen layout setting does in a web browser.

Control+F is also handed straight to the program, so that it forwards the current message in Microsoft Outlook. NVDA's own find stays on NVDA+control+F."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
version = 1.8
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.1
