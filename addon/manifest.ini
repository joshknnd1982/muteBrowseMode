name = muteBrowseMode
summary = "Mute Browse Mode"
description = """Adds a "Mute browse mode" combo box to NVDA's Speech settings.

It stops NVDA from announcing the document and reading the first line every time a web page finishes loading or an Outlook message is opened. Choose between staying completely silent, playing three quick ascending tones instead, or leaving NVDA's normal behaviour alone."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
version = 1.0
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.1
